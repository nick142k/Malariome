<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MalariaAI{% endblock %} · AI-Assisted Malaria Screening</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="wrap bar">
    <a class="brand" href="{{ url_for('index') }}" aria-label="MalariaAI home">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#3ddbc8" stroke-width="2.5"/><circle cx="16" cy="16" r="5" fill="#3ddbc8"/><circle cx="23" cy="9" r="2.4" fill="#ff7a90"/></svg>
      <span>Malaria<b>AI</b></span>
    </a>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'on' if request.endpoint == 'index' }}">Screen</a>
      <a href="{{ url_for('history') }}" class="{{ 'on' if request.endpoint == 'history' }}">History</a>
      <a href="{{ url_for('model_page') }}" class="{{ 'on' if request.endpoint == 'model_page' }}">Model</a>
      <a href="{{ url_for('about') }}" class="{{ 'on' if request.endpoint == 'about' }}">About</a>
    </nav>
  </div>
</header>
<main class="wrap">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="flash {{ cat }}" role="alert">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="disclaimer"><div class="wrap"><strong>Medical disclaimer.</strong> {{ disclaimer }}</div></footer>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
